
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eco Jump</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <div id="game-container">
    <div id="hud">
      <div>🌱 ECO JUMP</div>
      <div>HEIGHT: <span id="height">0</span> m</div>
      <div>SCORE: <span id="score">0</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="gameOver">
      <h1>GAME OVER</h1>
      <p>최고 높이: <strong><span id="finalHeight">0</span>m</strong></p>
      <p>점수: <strong><span id="finalScore">0</span></strong></p>
      <button onclick="restartGame()">다시 하기</button>
    </div>
  </div>

  <script>
    window.ecoJumpSkin = "basic";

    window.addEventListener("message", function(event) {
      const message = event.data;
      if (!message || !message.type) return;

      if (message.type === "streamlit:render") {
        const args = message.args || {};
        window.ecoJumpSkin = args.skin || "basic";
      }
    });

    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:componentReady",
      apiVersion: 1
    }, "*");

    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setFrameHeight",
      height: 720
    }, "*");
  </script>

  <script src="game.js"></script>
</body>
</html>
