<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eco Jump</title>

  <!-- 한글 픽셀 폰트 (갈무리). 불러오지 못하면 기본 고정폭 글꼴로 표시됩니다. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <div id="game-container">
    <div id="hud">
      <div class="hud-title">ECO JUMP</div>
      <div>높이 <span id="height">0</span>m</div>
      <div>점수 <span id="score">0</span></div>
      <div>난이도 <span id="difficulty">쉬움</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="gameOver">
      <h1>GAME OVER</h1>
      <p>최고 높이: <strong><span id="finalHeight">0</span>m</strong></p>
      <p>점수: <strong><span id="finalScore">0</span></strong></p>
      <button onclick="restartGame()">다시 하기</button>
    </div>
  </div>

  <script>
    window.ecoJumpSkin = "basic";

    window.addEventListener("message", function(event) {
      const message = event.data;

      if (!message || message.type !== "streamlit:render") {
        return;
      }

      const args = message.args || {};
      window.ecoJumpSkin = args.skin || "basic";
    });

    // Streamlit에 컴포넌트 준비 완료 알림
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:componentReady",
      apiVersion: 1
    }, "*");

    // 게임 화면 높이 지정
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setFrameHeight",
      height: 720
    }, "*");
  </script>

  <script src="game.js"></script>
</body>
</html>
